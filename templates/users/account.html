{% extends 'base.html' %}

{% block title %}Аккаунт - NotAvito{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div style="background-color: #f5f5f5; padding: 30px; border-radius: 16px; text-align: center;">
        <h2 style="margin-bottom: 30px;">👤 Аккаунт</h2>
        
        <div style="width: 120px; height: 120px; background-color: #555555; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 48px; color: white;">{{ user.username|first|upper }}</span>
        </div>
        
        <div style="background-color: white; border-radius: 12px; padding: 20px; text-align: left;">
            <div style="margin-bottom: 15px;">
                <label style="color: #666; display: block; font-size: 12px;">Имя пользователя</label>
                <div style="font-size: 18px; font-weight: 500;">{{ user.username }}</div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="color: #666; display: block; font-size: 12px;">Email</label>
                <div style="font-size: 18px; font-weight: 500;">{{ user.email }}</div>
            </div>
            
            <div>
                <label style="color: #666; display: block; font-size: 12px;">Дата регистрации</label>
                <div style="font-size: 18px; font-weight: 500;">{{ user.date_joined|date:"d.m.Y" }}</div>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="{% url 'edit_profile' %}" class="btn btn-primary">✏️ Редактировать профиль</a>
        </div>
    </div>
</div>
{% endblock %}
