{% extends 'base.html' %}

{% block title %}Вход - NotAvito{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 30px;">🔐 Вход в аккаунт</h2>
    
    {% if form.non_field_errors %}
    <div style="background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px;">
        {% for error in form.non_field_errors %}
        <p style="margin: 0;">{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Имя пользователя</label>
            <input type="text" name="username" id="id_username" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
    </form>
    
    <p style="margin-top: 20px; text-align: center;">
        Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a>
    </p>
</div>
{% endblock %}
